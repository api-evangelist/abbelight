aid: abbelight
name: Abbelight
description: 'Abbelight is a French bioimaging company founded in 2016 and headquartered
  in Cachan, near Paris, that designs and manufactures single-molecule localization
  microscopy (SMLM) and nanoscopy instrumentation. Its modular SAFe platform — SAFe
  Excitation, SAFe Detection and the SAFe Nexus optronic control bay — mounts on the
  camera port of any inverted microscope and upgrades it from diffraction-limited
  widefield and TIRF imaging to super-resolution techniques including STORM, PALM,
  DNA-PAINT and spectral demixing. The company also ships the Smart Flow automated
  sample-preparation system, ready-to-use staining and buffer kits, and the SAFe Neo
  software suite for 3D quantitative analysis and visualization of localization data.
  Abbelight sells through account executives and a consumables webshop, and raised a
  Series B led by AVANT BIO in January 2026. As of this profile it publishes no public
  API, SDK, developer portal or machine-readable specification.'
